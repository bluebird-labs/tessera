<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" />
    <link rel="stylesheet" href="tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
      html, body { margin: 0; background: #07080f; }
      #wrap { width: 1180px; height: 720px; position: relative; }
      svg { display: block; width: 1180px; height: 720px; }
    </style>
  </head>
  <body>
    <div id="wrap"><svg id="viz"></svg></div>
    <script src="data.js"></script>
    <script src="viz-core.js"></script>
    <script src="view-domain.js"></script>
    <script src="view-data.js"></script>
    <script src="view-flow.js"></script>
    <script>
      const which = new URLSearchParams(location.search).get("v") || "domain";
      const layout = new URLSearchParams(location.search).get("l") || undefined;
      const svg = d3.select("#viz").attr("width", 1180).attr("height", 720);
      window.VizCore.injectDefs(svg);
      window.TesseraViews[which].render({
        svg, width: 1180, height: 720, layout,
        disabledTypes: new Set(), selectedId: null,
        select: (id) => { svg.selectAll("*").remove(); window.VizCore.injectDefs(svg);
          window.__api = window.TesseraViews[which].render({ svg, width:1180, height:720, layout, disabledTypes:new Set(), selectedId:id, select:()=>{} }); },
      });
    </script>
  </body>
</html>
