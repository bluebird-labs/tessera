services:
  terminusdb:
    image: terminusdb/terminusdb-server:latest
    container_name: tessera-terminusdb
    ports:
      - "${TERMINUSDB_PORT:-6363}:6363"
    environment:
      TERMINUSDB_SERVER_PORT: "6363"
      TERMINUSDB_ADMIN_PASS: "${TERMINUSDB_ADMIN_PASS:?Set TERMINUSDB_ADMIN_PASS in .env}"
    volumes:
      - terminusdb-storage:/app/terminusdb/storage

volumes:
  terminusdb-storage:
